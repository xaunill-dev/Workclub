<trkpt lat="24.7629019" lon="121.3413022"><ele>653.13</ele></trkpt>
<trkpt lat="24.7629431" lon="121.3415040"><ele>642.39</ele></trkpt>
<trkpt lat="24.7630442" lon="121.3416754"><ele>644.11</ele></trkpt>
<trkpt lat="24.7629573" lon="121.3414981"><ele>652.76</ele></trkpt>
<trkpt lat="24.7629164" lon="121.3412982"><ele>652.52</ele></trkpt>
</trkseg>
</trk>
</gpx>`;

    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(fullGpxString, "text/xml");

    // 1. 解析軌跡點 (trkpt)
    const trackPoints = xmlDoc.getElementsByTagName("trkpt");
    const routeCoordinates = [];
    const elevationData = [];
    const chartLabels = [];

    for (let i = 0; i < trackPoints.length; i++) {
        const pt = trackPoints[i];
        const lat = parseFloat(pt.getAttribute("lat"));
        const lon = parseFloat(pt.getAttribute("lon"));
        const eleNode = pt.getElementsByTagName("ele")[0];
        const ele = eleNode ? parseFloat(eleNode.textContent) : 0;

        routeCoordinates.push([lat, lon]);
        elevationData.push(ele);
        chartLabels.push(i);
    }

    // 2. 初始化地圖（使用台灣通用電子地圖 EMAP）
    const map = L.map('map').setView(routeCoordinates[0], 14);

    L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
        attribution: '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank">內政部國土測繪中心</a>',
        maxZoom: 20
    }).addTo(map);

    const polyline = L.polyline(routeCoordinates, {
        color: '#e53e3e',
        weight: 4,
        opacity: 0.85
    }).addTo(map);

    map.fitBounds(polyline.getBounds());

    // 3. 解析航點 (wpt) 並繪製標記與填充時間表格
    const waypoints = xmlDoc.getElementsByTagName("wpt");
    const tableBody = document.getElementById("waypoints-table-body");

    for (let i = 0; i < waypoints.length; i++) {
        const wpt = waypoints[i];
        const lat = parseFloat(wpt.getAttribute("lat"));
        const lon = parseFloat(wpt.getAttribute("lon"));
        
        const nameNode = wpt.getElementsByTagName("name")[0];
        const eleNode = wpt.getElementsByTagName("ele")[0];
        const timeNode = wpt.getElementsByTagName("time")[0];
        const typeNode = wpt.getElementsByTagName("type")[0];

        const rawName = nameNode ? nameNode.textContent.trim() : "";
        const ele = eleNode ? parseFloat(eleNode.textContent).toFixed(1) : "-";
        const type = typeNode ? typeNode.textContent.trim() : "標記點";
        const timeStr = timeNode ? timeNode.textContent.trim() : "";

        // 轉換為在地時間格式 (UTC+8)
        let formattedTime = "-";
        if (timeStr) {
            const dateObj = new Date(timeStr);
            formattedTime = dateObj.toLocaleString("zh-TW", {
                timeZone: "Asia/Taipei",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });
        }

        const displayName = rawName || `${type} ${i + 1}`;

        // 地圖加上圓形標記
        const markerColor = type === "起點" ? "#38a169" : (type === "終點" ? "#e53e3e" : "#3182ce");
        L.circleMarker([lat, lon], {
            radius: 6,
            fillColor: markerColor,
            color: "#fff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
        }).addTo(map).bindPopup(`<b>${displayName}</b><br>類型: ${type}<br>時間: ${formattedTime}<br>海拔: ${ele} m`);

        // 產生表格項目
        let badgeClass = "badge-point";
        if (type === "起點") badgeClass = "badge-start";
        if (type === "終點") badgeClass = "badge-end";

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><span class="badge ${badgeClass}">${type}</span></td>
            <td><strong>${displayName}</strong></td>
            <td>${formattedTime}</td>
            <td>${ele} m</td>
            <td>${lat.toFixed(5)}, ${lon.toFixed(5)}</td>
        `;
        tableBody.appendChild(tr);
    }

    // 4. 初始化海拔剖面圖
    const ctx = document.getElementById('elevationChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartLabels,
            datasets: [{
                label: '海拔高度 (公尺)',
                data: elevationData,
                borderColor: '#3182ce',
                backgroundColor: 'rgba(49, 130, 206, 0.15)',
                borderWidth: 2,
                fill: true,
                pointRadius: 0,
                tension: 0.25
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    display: false
                },
                y: {
                    title: {
                        display: true,
                        text: '海拔 (m)'
                    }
                }
            },
            plugins: {
                legend: {
                    position: 'top',
                },
                tooltip: {
                    callbacks: {
                        title: () => null,
                        label: function(context) {
                            return `海拔: ${context.parsed.y} 公尺`;
                        }
                    }
                }
            }
        }
    });
</script>
</body>
</html>
